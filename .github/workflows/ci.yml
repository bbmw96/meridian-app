name: MERIDIAN CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  mql-compiler:
    name: MQL Compiler (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mql
      - name: Format check
        run: cargo fmt --manifest-path mql/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --manifest-path mql/Cargo.toml -- -D warnings
      - name: Tests
        run: cargo test --manifest-path mql/Cargo.toml

  gateway:
    name: Gateway Service (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: services/gateway/go.sum
      - name: Lint
        uses: golangci/golangci-lint-action@v4
        with:
          working-directory: services/gateway
      - name: Tests
        run: go test ./... -race -coverprofile=coverage.out
      - name: Build
        run: go build -o /dev/null ./...

  intelligence:
    name: Intelligence Service (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/intelligence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/intelligence/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt && pip install ruff pytest pytest-asyncio
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest --tb=short

  bff:
    name: BFF Service (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/bff
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/bff/package-lock.json
      - name: Install
        run: npm ci
      - name: Type check
        run: npm run type-check
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test

  realtime:
    name: Realtime Service (Elixir)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/realtime
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.17"
          otp-version: "27"
      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: services/realtime/deps
          key: ${{ runner.os }}-mix-${{ hashFiles('services/realtime/mix.lock') }}
      - name: Install deps
        run: mix deps.get
      - name: Compile
        run: mix compile --warnings-as-errors
      - name: Tests
        run: mix test

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust audit
        run: |
          cargo install cargo-audit
          cargo audit --manifest-path mql/Cargo.toml
      - name: Python safety check
        run: |
          pip install safety
          safety check -r services/intelligence/requirements.txt
      - name: Node audit
        working-directory: services/bff
        run: npm audit --audit-level=high

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [mql-compiler, gateway, intelligence, bff, realtime]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build gateway image
        uses: docker/build-push-action@v5
        with:
          context: services/gateway
          file: infrastructure/docker/gateway.Dockerfile
          push: false
      - name: Build intelligence image
        uses: docker/build-push-action@v5
        with:
          context: services/intelligence
          file: infrastructure/docker/intelligence.Dockerfile
          push: false
      - name: Build BFF image
        uses: docker/build-push-action@v5
        with:
          context: services/bff
          file: infrastructure/docker/bff.Dockerfile
          push: false
      - name: Build realtime image
        uses: docker/build-push-action@v5
        with:
          context: services/realtime
          file: infrastructure/docker/realtime.Dockerfile
          push: false
