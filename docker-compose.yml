version: "3.8"

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6
    container_name: meridian-zookeeper
    networks:
      - meridian-network
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.6
    container_name: meridian-kafka
    networks:
      - meridian-network
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
    depends_on:
      - zookeeper
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: meridian-postgres
    networks:
      - meridian-network
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: meridian
      POSTGRES_USER: ${POSTGRES_USER:-meridian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/migrations/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-meridian} -d meridian"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: meridian-redis
    networks:
      - meridian-network
    ports:
      - "6379:6379"
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1
      --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24
    container_name: meridian-clickhouse
    networks:
      - meridian-network
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  gateway:
    build:
      context: ./services/gateway
      dockerfile: ../../infrastructure/docker/gateway.Dockerfile
    container_name: meridian-gateway
    networks:
      - meridian-network
    ports:
      - "8080:8080"
    environment:
      REDIS_ADDR: redis:6379
      INTELLIGENCE_SERVICE_URL: http://intelligence:8001
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      GIN_MODE: release
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  intelligence:
    build:
      context: ./services/intelligence
      dockerfile: ../../infrastructure/docker/intelligence.Dockerfile
    container_name: meridian-intelligence
    networks:
      - meridian-network
    ports:
      - "8001:8001"
    environment:
      REDIS_URL: redis://redis:6379
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  bff:
    build:
      context: ./services/bff
      dockerfile: ../../infrastructure/docker/bff.Dockerfile
    container_name: meridian-bff
    networks:
      - meridian-network
    ports:
      - "4000:4000"
    environment:
      GATEWAY_URL: http://gateway:8080
      INTELLIGENCE_URL: http://intelligence:8001
      REDIS_URL: redis://redis:6379
      NODE_ENV: ${ENVIRONMENT:-development}
      PORT: "4000"
    depends_on:
      - gateway
    restart: unless-stopped

  realtime:
    build:
      context: ./services/realtime
      dockerfile: ../../infrastructure/docker/realtime.Dockerfile
    container_name: meridian-realtime
    networks:
      - meridian-network
    ports:
      - "4001:4001"
    environment:
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?SECRET_KEY_BASE is required}
      MIX_ENV: prod
      PORT: "4001"
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    restart: unless-stopped

networks:
  meridian-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  clickhouse_data:
