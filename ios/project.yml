# XcodeGen project specification for MERIDIAN
# Generate with: xcodegen generate
# Install XcodeGen: brew install xcodegen

name: MERIDIAN
options:
  bundleIdPrefix: com.meridian
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.2"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
  usesTabs: false
  indentWidth: 4
  tabWidth: 4

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_TESTABILITY: YES
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    GCC_OPTIMIZATION_LEVEL: 0
    SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
    CURRENT_PROJECT_VERSION: 2
    MARKETING_VERSION: 2.0.0
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  MERIDIAN:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    bundleId: com.meridian.app
    sources:
      - path: MERIDIAN
        excludes:
          - "**/*.md"
    resources:
      - path: MERIDIAN/Resources
    info:
      path: MERIDIAN/Info.plist
      properties:
        CFBundleName: MERIDIAN
        CFBundleDisplayName: MERIDIAN
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundlePackageType: APPL
        CFBundleDevelopmentRegion: en-GB
        CFBundleLocalizations:
          - en
          - ar
          - zh-Hans
          - zh-Hant
          - es
          - fr
          - de
          - ja
          - ko
          - pt-BR
          - it
          - ru
          - nl
          - pl
          - sv
          - tr
          - hi
          - id
          - th
          - vi
          - uk
          - cs
          - hu
          - ro
          - da
          - fi
          - no
          - ms
          - he
          - fa
        # Privacy usage descriptions
        NSCameraUsageDescription: "MERIDIAN uses the camera to scan QR codes, barcodes, and documents for intelligence capture."
        NSFaceIDUsageDescription: "MERIDIAN uses Face ID to unlock your encrypted Intelligence Vault (CIPHER Protocol)."
        NSLocalNetworkUsageDescription: "MERIDIAN uses the local network for development server connections."
        NSSpeechRecognitionUsageDescription: "MERIDIAN uses speech recognition for voice-activated intelligence queries."
        NSMicrophoneUsageDescription: "MERIDIAN uses the microphone for voice queries and audio intelligence capture."
        # Background modes — required for remote notifications and background fetch
        UIBackgroundModes:
          - fetch
          - remote-notification
          - processing
          - background-processing
        # App Transport Security
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
        # UI configuration
        UILaunchStoryboardName: LaunchScreen
        UIApplicationSupportsIndirectInputEvents: YES
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Export compliance — CIPHER Protocol uses standard CryptoKit AES-GCM (exempt)
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_NAME: MERIDIAN
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        # Entitlements
        CODE_SIGN_ENTITLEMENTS: MERIDIAN/MERIDIAN.entitlements
        # Automatic signing — Xcode Cloud / Codemagic will override with team ID
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
    dependencies:
      # SPM packages
      - package: apollo-ios
        product: Apollo
      - package: apollo-ios
        product: ApolloAPI
      - package: swift-collections
        product: Collections
      # System frameworks — new engines
      - sdk: NaturalLanguage.framework       # QUORUM, NEXUS, VAUNT, AXIOM, PRISM
      - sdk: CryptoKit.framework             # CIPHER Protocol
      - sdk: LocalAuthentication.framework   # CIPHER — Face ID / Touch ID
      - sdk: Network.framework               # VAUNT — passive DNS fingerprinting
      - sdk: BackgroundTasks.framework       # PRISM — offline model updates
      - sdk: Vision.framework                # VAUNT — future document OCR
    scheme:
      testTargets:
        - MERIDIANTests

  MERIDIANTests:
    type: bundle.unit-test
    platform: iOS
    bundleId: com.meridian.app.tests
    sources:
      - path: MERIDIANTests
    dependencies:
      - target: MERIDIAN
    settings:
      base:
        SWIFT_STRICT_CONCURRENCY: complete

packages:
  apollo-ios:
    url: https://github.com/apollographql/apollo-ios
    from: "1.9.0"
  swift-collections:
    url: https://github.com/apple/swift-collections
    from: "1.1.0"
