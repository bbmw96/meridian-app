# XcodeGen project specification for MERIDIAN
# Generate with: xcodegen generate
# Install XcodeGen: brew install xcodegen

name: MERIDIAN
options:
  bundleIdPrefix: com.meridian
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
  usesTabs: false
  indentWidth: 4
  tabWidth: 4

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_TESTABILITY: YES
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    GCC_OPTIMIZATION_LEVEL: 0
    SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  MERIDIAN:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    bundleId: com.meridian.app
    sources:
      - path: MERIDIAN
        excludes:
          - "**/*.md"
    resources:
      - path: MERIDIAN/Resources
    info:
      path: MERIDIAN/Info.plist
      properties:
        CFBundleName: MERIDIAN
        CFBundleDisplayName: MERIDIAN
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundlePackageType: APPL
        CFBundleDevelopmentRegion: en-GB
        CFBundleLocalizations:
          - en
          - ar
          - zh-Hans
          - zh-Hant
          - es
          - fr
          - de
          - ja
          - ko
          - pt-BR
          - it
          - ru
          - nl
          - pl
          - sv
          - tr
          - hi
          - id
          - th
          - vi
          - uk
          - cs
          - hu
          - ro
          - da
          - fi
          - no
          - ms
          - he
          - fa
        NSCameraUsageDescription: "MERIDIAN uses the camera to scan QR codes and barcodes for quick domain lookup."
        NSFaceIDUsageDescription: "Use Face ID to secure your MERIDIAN account."
        NSLocalNetworkUsageDescription: "MERIDIAN uses the local network for development server connections."
        UILaunchStoryboardName: LaunchScreen
        UIApplicationSupportsIndirectInputEvents: YES
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
    settings:
      base:
        PRODUCT_NAME: MERIDIAN
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    dependencies:
      - package: Apollo
      - package: ApolloAPI
      - package: Collections
    scheme:
      testTargets:
        - MERIDIANTests

  MERIDIANTests:
    type: bundle.unit-test
    platform: iOS
    bundleId: com.meridian.app.tests
    sources:
      - path: MERIDIANTests
    dependencies:
      - target: MERIDIAN

packages:
  apollo-ios:
    url: https://github.com/apollographql/apollo-ios
    from: "1.9.0"
  swift-collections:
    url: https://github.com/apple/swift-collections
    from: "1.1.0"
