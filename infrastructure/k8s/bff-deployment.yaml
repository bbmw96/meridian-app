apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff
  namespace: meridian
  labels:
    app: bff
    project: MERIDIAN
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bff
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: bff
        project: MERIDIAN
    spec:
      containers:
        - name: bff
          image: meridian/bff:latest
          ports:
            - containerPort: 4000
              protocol: TCP
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          env:
            - name: GATEWAY_URL
              value: "http://gateway:80"
            - name: INTELLIGENCE_URL
              value: "http://intelligence:8001"
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: meridian-secrets
                  key: redis-url
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "4000"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: bff
  namespace: meridian
  labels:
    app: bff
    project: MERIDIAN
spec:
  type: ClusterIP
  selector:
    app: bff
  ports:
    - name: graphql
      protocol: TCP
      port: 4000
      targetPort: 4000
