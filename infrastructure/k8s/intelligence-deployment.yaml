apiVersion: apps/v1
kind: Deployment
metadata:
  name: intelligence
  namespace: meridian
  labels:
    app: intelligence
    project: MERIDIAN
spec:
  replicas: 2
  selector:
    matchLabels:
      app: intelligence
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: intelligence
        project: MERIDIAN
    spec:
      containers:
        - name: intelligence
          image: meridian/intelligence:latest
          ports:
            - containerPort: 8001
              protocol: TCP
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 40
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: meridian-secrets
                  key: intelligence-database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: meridian-secrets
                  key: redis-url
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: meridian-secrets
                  key: openai-api-key
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: meridian-secrets
                  key: anthropic-api-key
            - name: ENVIRONMENT
              value: "production"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: intelligence
  namespace: meridian
  labels:
    app: intelligence
    project: MERIDIAN
spec:
  type: ClusterIP
  selector:
    app: intelligence
  ports:
    - name: http
      protocol: TCP
      port: 8001
      targetPort: 8001
