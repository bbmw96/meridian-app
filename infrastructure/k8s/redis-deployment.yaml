apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: meridian
  labels:
    app: redis
    project: MERIDIAN
data:
  redis.conf: |
    maxmemory 256mb
    maxmemory-policy allkeys-lru
    save 60 1
    loglevel warning
    protected-mode no
    tcp-keepalive 300
    timeout 0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: meridian
  labels:
    app: redis
    project: MERIDIAN
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        project: MERIDIAN
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command:
            - redis-server
            - /etc/redis/redis.conf
          ports:
            - containerPort: 6379
              protocol: TCP
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: redis-config
              mountPath: /etc/redis
      volumes:
        - name: redis-config
          configMap:
            name: redis-config
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: meridian
  labels:
    app: redis
    project: MERIDIAN
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - name: redis
      protocol: TCP
      port: 6379
      targetPort: 6379
